[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moe-experiment"
version = "0.1.0"
description = "Mixture of Experts (MoE) experiment project"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
keywords = ["machine-learning", "moe", "neural-networks", "huggingface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anyio>=4.14.0",
    "certifi>=2026.0.0",
    "charset-normalizer>=3.4.0",
    "click>=8.4.0",
    "filelock>=3.32.0",
    "fsspec>=2026.0.0",
    "gguf>=0.19.0",
    "h11>=0.16.0",
    "hf-xet>=1.6.0",
    "httpcore>=1.0.0",
    "httpx>=0.28.0",
    "huggingface-hub>=1.27.0",
    "idna>=3.18.0",
    "numpy>=2.5.0",
    "packaging>=26.0.0",
    "PyYAML>=6.0.0",
    "requests>=2.34.0",
    "tqdm>=4.70.0",
    "typing-extensions>=4.16.0",
    "urllib3>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/username/moe-experiment"
Repository = "https://github.com/username/moe-experiment"
Issues = "https://github.com/username/moe-experiment/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/moe_experiment"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
